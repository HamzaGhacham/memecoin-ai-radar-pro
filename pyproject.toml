[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memecoin-ai-radar-pro"
version = "0.2.0"
description = "Read-only Solana meme coin radar: integrated GitHub-Neon-Cloudflare research release"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
neon = ["psycopg[binary]>=3.2,<3.4"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
